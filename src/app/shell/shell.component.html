<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen">

  <!-- ══════════════════════════════════════
       TOP NAV
       ══════════════════════════════════════ -->
  <nav class="top-nav">
    <!-- Left: menu toggle + logo -->
    <div class="nav-left">
      <button class="nav-menu-btn" (click)="toggleSidebar()" [title]="sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <a class="nav-logo" href="#">
        <img src="envision-logo.png" alt="Envision" class="nav-logo-img">
      </a>
    </div>

    <!-- Right: icons + user info -->
    <div class="nav-right">
      <button class="nav-icon" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
      <button class="nav-icon" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </button>

      <!-- User pill -->
      <div class="nav-user">
        <div class="nav-avatar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="nav-user-info">
          <span class="nav-username">{{ auth.displayName }}</span>
          <span class="nav-role">{{ auth.currentUser?.role }}</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════
       BODY
       ══════════════════════════════════════ -->
  <div class="app-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-inner">

        <div class="sb-section">
          <div class="sb-label">PMO</div>
          <button class="sb-item active">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="sb-label-text">Demand Plan</span>
          </button>
        </div>

        <div class="sb-spacer"></div>

        <div class="sb-section">
          <div class="sb-label">EXIT PORTAL</div>
          <button class="sb-item sb-logout" (click)="openLogoutConfirm()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span class="sb-label-text">LogOut</span>
          </button>
        </div>

      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <router-outlet />
    </main>

  </div>
</div>

<!-- ══════════════════════════════════════
     LOGOUT CONFIRMATION DIALOG
     ══════════════════════════════════════ -->
<div class="confirm-overlay" *ngIf="logoutConfirm" (click)="$event.target === $event.currentTarget ? cancelLogout() : null">
  <div class="confirm-dialog">
    <div class="confirm-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <h3>Sign Out?</h3>
    <p>You are about to sign out of the Envision platform. Any unsaved data will be lost.</p>
    <div class="confirm-user">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Signed in as <strong>{{ auth.username }}</strong>
    </div>
    <div class="confirm-actions">
      <button class="btn-cancel" (click)="cancelLogout()">Cancel</button>
      <button class="btn-confirm-logout" (click)="confirmLogout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Yes, Sign Out
      </button>
    </div>
  </div>
</div>
